# Vérifications lancées sur chaque pull request et sur main.
# Les noms des tâches (« Site vitrine », etc.) sont ceux à rendre obligatoires
# dans la règle de protection de main (docs/securite/parametres-github.md).
name: Vérifications

on:
  pull_request:
  push:
    branches: [main]

# Le jeton GitHub de ces tâches ne peut que lire le dépôt
permissions:
  contents: read

concurrency:
  group: verifications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site vitrine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Dépendances (versions exactes du fichier de verrouillage)
        run: npm ci
      - name: Construction (Astro)
        run: npm run build -w @dbs/site-vitrine
      - name: Liens, images, politique de sécurité du contenu, référencement, secrets
        run: node scripts/verifier-site.mjs
      - name: Navigateur Chromium pour les tests
        run: npx playwright install --with-deps chromium
      - name: Pages, accessibilité (axe), formulaire de devis (WhatsApp et enregistrement), téléphone et ordinateur
        run: npm run test:navigateur -w @dbs/site-vitrine

  documentation:
    name: Liens de la documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/verifier-liens-docs.mjs

  base-de-donnees:
    name: Base de données
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          # Serveur jetable, détruit à la fin de la tâche
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Migrations et tests de sécurité
        run: ./database/tests/executer.sh

  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Dépendances (versions exactes du fichier de verrouillage)
        run: npm ci
      - name: Failles connues dans les dépendances de production
        run: npm audit --omit=dev --audit-level=high
      - name: Vérification des types
        run: npm run verifier-types -w @dbs/api
      - name: Antivirus ClamAV de test (signature EICAR seulement, aucune base téléchargée)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clamav-daemon
          apps/api/tests/antivirus/demarrer-clamd.sh 3310
      - name: Tests unitaires et tests de sécurité contre PostgreSQL (et le vrai ClamAV)
        run: npm run test -w @dbs/api
        env:
          ANTIVIRUS_ADRESSE_TEST: 127.0.0.1:3310
      - name: Compilation
        run: npm run build -w @dbs/api

  back-office:
    name: Back-office
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Dépendances (versions exactes du fichier de verrouillage)
        run: npm ci
      - name: Vérification des types
        run: npm run verifier-types -w @dbs/admin
      - name: Navigateur Chromium pour le test de bout en bout
        run: npx playwright install --with-deps chromium
      - name: Parcours complet dans le navigateur (base, API, back-office et ses en-têtes de sécurité)
        run: npm run test:e2e -w @dbs/admin

  secrets:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks sur tout l'historique
        # safe.directory : le dépôt monté n'appartient pas à l'utilisateur du conteneur
        run: >-
          docker run --rm -v "$PWD:/depot"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/depot
          zricethezav/gitleaks:v8.26.0 git /depot --redact --verbose --no-banner
