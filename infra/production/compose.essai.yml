# Essai de la pile de production sur un poste, ou dans l'intégration continue (infra/production/essai.sh) :
# certificats HTTPS internes, adresses en .localhost, antivirus de démonstration (il ne refuse que le fichier de
# test EICAR) au lieu de ClamAV et de ses 300 Mo de signatures. Jamais en production.
services:
  web:
    environment:
      TLS_LOCAL: tls internal
    ports: !override ["127.0.0.1:8443:443"]
  clamav:
    image: node:22-bookworm-slim
    user: node
    command: ["node", "/clamd/clamd-factice.mjs", "3310", "0.0.0.0"]
    cap_add: !reset []
    volumes: !override ["../../apps/api/tests/antivirus:/clamd:ro"]
